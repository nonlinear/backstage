---
# Epic Status Lifecycle
# Canonical order: active → backlog → published

statuses:
  active:
    order: 1
    description: "Has unfinished tasks, has branch. Work in progress."
    conditions:
      - "Has tasks (beyond default template)"
      - "Has git branch (not on main)"
      - "Not all tasks checked"
    can_transition_to:
      - published
      - backlog
    
  backlog:
    order: 2
    description: "Only default tasks, unchecked. Not started yet. No branch."
    conditions:
      - "Only has default unchecked tasks"
      - "No custom tasks added"
      - "On main branch (no epic branch)"
    can_transition_to:
      - active
    
  published:
    order: 3
    description: "All tasks checked. Terminal state."
    conditions:
      - "All tasks checked (100% complete)"
      - "Epic is done"
    can_transition_to: []

# Transition rules
transitions:
  backlog_to_active:
    trigger: "Add tasks or create branch"
  
  active_to_published:
    trigger: "Check all tasks"
    
  active_to_backlog:
    trigger: "Remove all custom tasks and return to main"
    note: "Regression, avoid if possible"

# Display order (everywhere)
display_order:
  - active
  - backlog
  - published
