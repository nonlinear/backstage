notes: |
  ## Context (2026-03-13)
  
  **Situation:** Mac Studio needs to be "returned" and re-purchased under company entity (tax purposes)
  **Risk:** First real Time Machine recovery test (trial by fire)
  **Consequence of failure:** Nicholas stranded without infrastructure (work blocked)
  
  ## Critical Services to Restore
  
  **Must work immediately:**
  - OpenClaw gateway (main + agents)
  - Backstage (project management)
  - Tailscale (remote access)
  - Docker containers (Kavita, Home Assistant, Paperless)
  
  **Nice to have:**
  - LaunchAgents (auto-start services)
  - Homebrew packages
  - SSH keys
  
  ## Time Machine Backup Coverage
  
  **What's backed up:**
  - ~/Apps/ (Docker volumes + configs)
  - ~/.openclaw/ (gateway config)
  - ~/Backstage/ (project files)
  - ~/Documents/ (personal notes, connections, skills)
  - ~/Library/LaunchAgents/ (auto-start configs)
  
  **What's NOT backed up (needs manual):**
  - Homebrew itself (reinstall)
  - Tailscale (reinstall + re-auth)
  - Docker Desktop (reinstall)
  
  ## Recovery Philosophy
  
  **Sequential steps:**
  1. Restore user data (Time Machine)
  2. Restore system tools (Homebrew, Tailscale, Docker)
  3. Restore services (OpenClaw, containers, LaunchAgents)
  4. Validate (test all critical paths)
  
  **Document everything:**
  - What worked out of the box
  - What required manual steps
  - What failed + how to fix
  
  **Trial by fire = learning opportunity:**
  - First real disaster recovery test
  - Validates backup strategy
  - Exposes gaps in documentation
  
  ## Success Criteria
  
  - [ ] Nicholas can access Backstage from iPad (remote)
  - [ ] Nicholas can read ebooks via Kavita (remote)
  - [ ] OpenClaw agents respond in Matrix
  - [ ] Voice commands work (Home Assistant)
  - [ ] All services auto-start on boot
  - [ ] Recovery completed in <4 hours
  
  ## Post-Recovery
  
  - Document lessons learned
  - Update backup strategy (if gaps found)
  - Create automated recovery script (if possible)
  - Share recovery protocol (help others)
