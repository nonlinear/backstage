notes: |
  ## pm2 Test Failure (2026-03-14 21:27-21:30)
  
  **What happened:**
  - Installed pm2 globally
  - Created ecosystem config
  - Started services
  - Immediate restart loop (4-9 restarts in <1 minute)
  
  **Why:**
  - Next.js `npm run dev` exits immediately (hands off to webpack)
  - pm2 sees exit < 10s min_uptime → considers "crashed"
  - Restarts forever
  
  **Tried:**
  - wait_ready: true (stuck "waiting for ready")
  - Removing wait_ready (still restart loop)
  
  **Conclusion:**
  pm2 NOT compatible with Next.js dev mode.
  Production mode (npm start) would work, but dev mode required for hot reload.
  
  Docker Compose = better solution (containers persist, health checks work).
  
  ## Docker Compose Advantages
  
  ✅ **Process isolation** (no pm2 quirks)
  ✅ **Health checks** (HTTP-based, no false positives)
  ✅ **Dependency management** (PostgreSQL before Synapse)
  ✅ **Port conflict immunity** (each service isolated)
  ✅ **Future-proof** (add services via YAML)
  ✅ **Industry standard** (Docker >> LaunchAgents)
  ✅ **Reproducible** (Git-track compose file)
  ✅ **Observable** (logs, health status, monitoring)
  
  ## Philosophy Shift
  
  FROM: "Fix each service individually with LaunchAgents"
  TO: "Orchestrate all services as unified containerized stack"
  
  FROM: "pm2 for process management"
  TO: "Docker Compose for service orchestration"
  
  FROM: "Manual Tailscale proxy management"
  TO: "Scripted proxy enable/disable (boot-safe)"

