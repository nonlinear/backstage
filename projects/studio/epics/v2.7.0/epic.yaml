technical_notes:
  bot_accounts_vs_pat: |
    Bot Accounts (CORRECT for this system):
    - Created via System Console → Bot Accounts
    - Dedicated automation user
    - Own username (@botname)
    - Own token (revokable independently)
    - Perfect for agents with distinct identities
    
    Personal Access Tokens (WRONG):
    - Token from human user account
    - Messages appear as that user
    - Inherits user permissions (confusing)
    - Revoke token = break automation
    - Bad audit trail
    
    System has agents = use Bot Accounts.
  
  multi_account_architecture: |
    Why multi-account (not single bot with routing):
    
    Multi-account:
    - Each agent = 1 Mattermost bot
    - Natural identity (@business-analyst talks, @design-engineer talks)
    - Audit trail perfect (who said what)
    - Error isolation (1 bot breaks ≠ all break)
    - Separate permissions possible
    - Fits epic grooming (agents bid independently)
    
    Single bot:
    - All messages from @openclaw
    - Internal routing decides which agent logic runs
    - Confusing conversations (all same voice)
    - Poor auditability
    - Agents look identical
    
    For system with distinct agent personas → multi-account correct.
  
  channel_id_discovery: |
    Channel IDs = 26-char alphanumeric strings
    
    UI method (easiest):
    1. Open channel in browser
    2. URL: https://studio.../channels/ABC123XYZ
    3. ABC123XYZ = channel ID
    
    API method:
    - GET /api/v4/teams/{team_id}/channels
    - Parse JSON, find by name
    
    mmctl method (if installed):
    - mmctl channel list TEAM_NAME
    
    Store mapping:
    - Create ~/Backstage/projects/studio/mattermost-channels.json
    - Map channel names → IDs
    - Reference in config
  
  debugging_non_response: |
    Checklist when bot doesn't respond:
    
    1. Bot in channel?
       - /invite @botname (UI)
       - GET /channels/{id}/members (API)
    
    2. Token valid?
       - Check .env has correct token
       - Verify Authorization: Bearer TOKEN works
    
    3. Websocket connected?
       - Bots listen via websocket events (event: posted)
       - Check Gateway logs for connection
    
    4. Routing correct?
       - openclaw.json has channel ID mapped
       - agentId matches bot account name
    
    5. Logs:
       - /tmp/openclaw/openclaw-YYYY-MM-DD.log
       - ~/Library/Logs (macOS)
       - docker logs (if containerized)
    
    6. Permissions:
       - Bot needs: post:channels, read:channels, read:posts
       - Check System Console → Bot Accounts → Permissions
  
  message_formats_supported: |
    Mattermost supports:
    
    ✅ Plain text
    ✅ Markdown (bold, italic, code, lists)
    ✅ Code blocks (```language)
    ✅ Attachments (images, PDFs, files)
    ✅ Interactive buttons (Approve/Reject, etc.)
    
    OpenClaw Mattermost plugin likely supports:
    - Text ✅
    - Markdown ✅
    - Buttons ❓ (depends on plugin version)
    - Complex attachments ❓ (depends on plugin)
    
    For epic grooming use case:
    - Text + Markdown = sufficient
    - Buttons useful later (Approve epic for night-shift? [Yes] [No])
  
  token_expiration: |
    Good news: Bot tokens do NOT expire automatically.
    
    Tokens only invalid if:
    - Manually revoked
    - Manually regenerated
    - Bot account deleted
    
    OpenClaw won't break unexpectedly.
    
    Best practice:
    - Store in ~/Documents/personal/.env (NOT git)
    - Document renewal process (for security rotation)
    - No automatic expiration monitoring needed
  
  incremental_rollout_plan: |
    Don't build everything at once. Validate each step.
    
    Step 1: Single bot test
    - Create @business-analyst
    - Create #ai-test channel
    - Configure OpenClaw (single account)
    - Test: send message → bot responds
    - Validate: identity, audit trail
    
    Step 2: Add second bot
    - Create @design-engineer
    - Keep both in #ai-test
    - Verify: both respond (differentiated)
    
    Step 3: Channel routing
    - Create #business-analyst, #design-engineer
    - Configure multi-account routing
    - Test: each bot only responds in own channel
    
    Step 4: Epic automation (future - v4.1.0)
    - Grooming rooms auto-created
    - Agent bidding
    - Decision capture
    - Night-shift orchestration

