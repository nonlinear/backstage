decisions:
  - date: 2026-03-15 06:00
    decision: "Abandon Matrix, use Mattermost instead"
    rationale: |
      Matrix issues stacked up:
      - Encryption causing sync failures
      - Room routing config too complex
      - Bot invites failing (bad request errors)
      - 5+ hours debugging with no resolution
      
      Mattermost advantages:
      - Already working (container healthy, UI accessible)
      - Better OpenClaw plugin docs
      - Simpler config (no encryption, clear routing)
      - Industry-standard team chat (easier to maintain)
  
  - date: 2026-03-15 13:47
    decision: "Use Bot Accounts (NOT Personal Access Tokens)"
    rationale: |
      Bot Accounts (System Console → Bot Accounts):
      - Dedicated user for automation
      - Has own username (@business-analyst, @design-engineer)
      - Own token (revokable without affecting humans)
      - Perfect for agents with distinct identities
      - Creates perfect audit trail
      
      Personal Access Tokens (PAT):
      - Herits user permissions (confusing)
      - Appears as you talking (bad auditability)
      - Revoking token breaks automation
      
      System has agents with own identities → Bot Accounts correct choice.
  
  - date: 2026-03-15 13:47
    decision: "Use Multi-Account config (NOT single bot with routing)"
    rationale: |
      Multi-Account (each agent = 1 bot):
      {
        "accounts": {
          "business-analyst": {"botToken": "TOKEN_A"},
          "design-engineer": {"botToken": "TOKEN_B"}
        }
      }
      
      Advantages:
      - Natural conversations (each bot has identity)
      - Better auditability (who said what)
      - Error isolation (1 bot breaks ≠ all break)
      - Separate permissions
      - Aligns with agent bidding architecture (epic phases)
      
      Single bot with routing:
      - All messages from @openclaw (confusing)
      - Poor audit trail
      - All agents look identical
      
      Multi-account fits naturally with epic grooming system.
  
  - date: 2026-03-15 13:47
    decision: "Bot tokens do NOT expire automatically"
    rationale: |
      Good news: Bot tokens persist until manually revoked/regenerated.
      
      OpenClaw won't break unexpectedly.
      
      Best practice:
      - Store in ~/Documents/personal/.env (not git)
      - Document renewal process (for future rotation)
  
  - date: 2026-03-15 13:47
    decision: "Incremental rollout (1 bot → 2 bots → routing → automation)"
    rationale: |
      Step 1: 1 bot (@business-analyst), 1 channel (#ai-test), verify response
      Step 2: 2 bots (@business-analyst, @design-engineer)
      Step 3: Routing per channel
      Step 4: Epic automation (later, in v4.1.0 implementation)
      
      Don't build everything at once. Validate each step.

