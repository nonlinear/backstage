# Epic v0.3.0: True Parity

**Goal:** Guarantee agent visual verification BEFORE marking UI work done.

**Context:** Agent marked Librarian v0.27.0 done without visual verification → merged broken code to main. Need protocol + tooling to prevent this.

---

## Problem Statement

**Core issue:** Developing UI/frontend without visual feedback = irresponsible, causes breakage.

**What went wrong (2026-03-16):**
- Agent edited Librarian covers code
- Claimed "done" without seeing UI render
- Merged to main
- Covers actually broken (confirmed via Playwright screenshot)

**Root cause:** No enforcement of visual verification before task completion.

---

## Requirements

1. **Visual verification BEFORE claiming done** (mandatory)
2. **Low friction** (can't add 10min overhead per change)
3. **Reliable** (not "works sometimes")
4. **Automated/scriptable** (part of workflow, not manual)
5. **Agent-executable** (LLM can run, not just human)

---

## Constraints

**What agent CAN'T do:**
- See interactive browser window (`headless=False`)
- Visual inspection like human

**What agent CAN do:**
- Run Playwright headless tests
- Capture screenshots (bitmap)
- DOM inspection (HTML/accessibility tree)
- Automated assertions (`expect()`)

