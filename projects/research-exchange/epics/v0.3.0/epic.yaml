## Research Notes

**Attempted solutions:**
- ❌ Chrome Relay (OpenClaw) - buggy, unreliable
- ⚠️ Playwright screenshots - works but manual

**Discussion 2026-03-16:**
- Nicholas: `headless=False` útil para debug, mas não garante paridade do agente
- Agent: Paridade real = headless + assertions + screenshot + enforcement
- Commits = sem restrição (quebrado OK dentro de branch)
- Afirmações (task ✓) = require verification

**Key insight:**
> "o que o teste garante eh a aFIRMACAO que foi concluido, ticking the task."

