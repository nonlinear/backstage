scope: |
  Watch filesystem for changes:
  - organization.yaml
  - squads/*/squad.yaml
  - agents/*/*/agent.yaml
  - values/*.md
  
  On change → run composite.sh for affected scope:
  - organization.yaml change → composite.sh all
  - squad.yaml change → composite.sh all agents in squad
  - agent.yaml change → composite.sh <agent>
  - values/*.md change → composite.sh all (org values changed)
  
  Tools:
  - fswatch (macOS) or inotify (Linux)
  - Debounce: wait 2s after last change before regenerating
  - Run in background (LaunchAgent or systemd service)

notes: |
  Currently composite.sh must be run manually after YAML edits.
  Watcher automates this (DRY, low metabolic cost).
  
  Future: Extend to library topics, MCP additions (when registry changes).
