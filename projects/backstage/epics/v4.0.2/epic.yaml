version: v4.0.2
name: "yml to yaml (Emergency Patch)"
status: done
created: 2026-03-15
completed: 2026-03-15 15:11 EDT
updated: 2026-03-15 15:12 EDT
priority: P0
category: maintenance
tags: [emergency, patch, yaml, semantic-versioning]

summary: |
  Emergency patch to standardize ALL YAML files to `.yaml` extension.
  Container couldn't find projects because code expected `.yaml` but files were `.yml`.
  
  **Semantic versioning:** Patch (v4.0.1 → v4.0.2) because:
  - No new features
  - No breaking changes
  - Bug fix only (file extension standardization)

problem: |
  Backstage UI showing "Projects: 0" after container restart.
  
  Root cause:
  - Code used `process.env.HOME` → `/root/Backstage/projects` (container)
  - Volume mount: `~/Backstage/projects` → `/app/projects`
  - Path mismatch: code looked in wrong directory
  
  Secondary issue:
  - Mixed `.yml` and `.yaml` extensions (168 `.yml` files)
  - Code expected `.yaml` after standardization
  - YAML parser error: `paperless-ingestion/project.yaml` had frontmatter `---` delimiters

decisions:
  - date: 2026-03-15 15:07
    decision: "ALL YAML files must use `.yaml` extension (not `.yml`)"
    rationale: |
      Industry standard = `.yaml` (YAML Ain't Markup Language)
      Consistency across all projects
      Avoid parser confusion
      
  - date: 2026-03-15 15:07
    decision: "Emergency patch = semantic versioning PATCH increment"
    rationale: |
      No new features → not MINOR
      No breaking changes → not MAJOR
      Bug fix only → PATCH (v4.0.1 → v4.0.2)

tasks:
  - id: T1
    text: "Add BACKSTAGE_ROOT env var to docker-compose.yml"
    status: done
    completed: 2026-03-15 15:05
    notes: |
      Added: BACKSTAGE_ROOT=/app/projects
      Container now uses env var instead of hardcoded path.
  
  - id: T2
    text: "Update code to use process.env.BACKSTAGE_ROOT"
    status: done
    completed: 2026-03-15 15:05
    notes: |
      Files updated:
      - app/api/projects/route.ts
      - app/app/projects/[project]/page.tsx (fallback path)
      
      Code: const BACKSTAGE_ROOT = process.env.BACKSTAGE_ROOT || path.join(...)
  
  - id: T3
    text: "Rename ALL .yml files to .yaml"
    status: done
    completed: 2026-03-15 15:08
    notes: |
      Command: find . -name "*.yml" -exec bash -c 'mv "$1" "${1%.yml}.yaml"' _ {} \;
      
      Result:
      - 168 .yml files renamed
      - 300 .yaml files total
      - Zero .yml remaining
  
  - id: T4
    text: "Update code references: .yml → .yaml"
    status: done
    completed: 2026-03-15 15:08
    notes: |
      Files updated:
      - app/app/projects/[project]/page.tsx (project.yml → project.yaml)
      - app/api/projects/route.ts (project.yml → project.yaml)
      - lib/epics.ts (project.yml → project.yaml)
  
  - id: T5
    text: "Fix YAML parse error (paperless-ingestion/project.yaml)"
    status: done
    completed: 2026-03-15 15:11
    notes: |
      Problem: Frontmatter delimiters (---) confused YAML parser
      Error: "unidentified alias *Purpose:**"
      
      Fix: Remove frontmatter, move content to `purpose` field
      
      Before:
      ---
      name: paperless ingestion
      ---
      **Purpose:** ...
      
      After:
      name: paperless ingestion
      purpose: |
        **Purpose:** ...
  
  - id: T6
    text: "Rebuild container with --no-cache"
    status: done
    completed: 2026-03-15 15:10
    notes: |
      Ensured fresh build with updated code.
      docker-compose build --no-cache backstage
  
  - id: T7
    text: "Verify projects API returns data"
    status: done
    completed: 2026-03-15 15:11
    notes: |
      curl http://localhost:3004/api/projects | jq -r '.projects[] | .name'
      
      Result: Backstage, Studio, Research Exchange, Agregore (flagship)
  
  - id: T8
    text: "Re-enable Tailscale proxy"
    status: done
    completed: 2026-03-15 15:11
    notes: |
      tailscale serve --bg --https=3004 http://localhost:3004
      
      Accessible: https://studio.adal-rigel.ts.net:3004

