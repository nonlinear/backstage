what_worked:
  - Git commit before renaming (safety net)
  - find + bash -c for bulk rename (reliable)
  - docker-compose build --no-cache (ensured fresh build)
  - Incremental fixes (env var → rename → parse error)

what_failed:
  - Initial rebuild used cached layers (old code)
  - Tailscale proxy blocked port during rebuild (repeated issue)
  - Local dev server (PID 885) blocked port after Tailscale off

lessons_learned:
  - Always `--no-cache` for critical container rebuilds
  - Check `lsof -ti :PORT` BEFORE docker-compose up (catch local servers)
  - Tailscale serve pattern: off → start container → re-enable serve
  - Semantic versioning: PATCH for bug fixes, MINOR for features, MAJOR for breaking changes
  - YAML frontmatter (`---`) not universal (some parsers fail)

known_issues:
  - epicCount returns null (separate bug, not blocker)
  - Tailscale serve auto-off needed before container restart (manual step)

future_work:
  - Script: auto-detect port blockers before docker-compose up
  - Pre-commit hook: reject .yml files (enforce .yaml)
  - YAML linter: detect frontmatter delimiters in project.yaml files
  - Container health check: verify /api/projects returns >0 projects

references:
