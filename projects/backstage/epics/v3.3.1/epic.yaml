notes: |
  ## Context (Grooming Session 2026-03-12)
  
  **Discovered during Pomodoro grooming:**
  - Current card behavior blocks navigation
  - No hot reload = have to restart Backstage every YAML edit
  - Both issues make grooming inefficient
  
  ## Current Card Bug
  
  **Problem:** Current (state) conflated with Notes (tab)
  
  **Current behavior (WRONG):**
  - Current card opens notes automatically
  - Current card → 500px width
  - If current, can't click tasks (reverts to notes)
  
  **Expected:**
  - **Current = STATE** (which card selected)
  - **Notes = TAB** (which content shown)
  - Current should NOT auto-open any tab
  - Current should NOT change width
  - Current should allow clicking any tab
  
  **Notes tab (CORRECT already):**
  - Click notes → becomes current ✅
  - Opens notes content ✅
  - Width 600px ✅
  
  ## Hot Reload Solution
  
  **Use chokidar file watcher:**
  
  ```javascript
  // app/lib/watch-projects.js
  import chokidar from 'chokidar';
  import { revalidatePath } from 'next/cache';
  
  if (process.env.NODE_ENV === 'development') {
    const watcher = chokidar.watch('../projects/**/*.yaml', {
      ignoreInitial: true,
    });
  
    watcher.on('change', (path) => {
      console.log(`Detected change in ${path}, revalidating...`);
      revalidatePath('/projects');
    });
  }
  ```
  
  **Import in layout.tsx:**
  ```typescript
  import '../lib/watch-projects';
  ```
  
  ## Success Criteria
  
  - [ ] Current card works independently of tab selection
  - [ ] Can click any tab on current card
  - [ ] YAML changes trigger browser reload automatically
  - [ ] No more manual Backstage restarts during grooming
  
  ## Impact
  
  **Before:** Grooming frustrating (constant restarts, broken navigation)
  **After:** Grooming smooth (immediate feedback, proper navigation)
