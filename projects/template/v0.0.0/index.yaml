# Epic Template - Metadata
# Copy this for new epics

name: "Template Epic"
version: "0.0.0"
status: "template"  # Replace with: proposed | approved | active | review | published | backlog
tier: "infrastructure"  # Replace with: infrastructure | product | research | etc.
contract_type: "diagram"  # Replace with: diagram | wireframe | sequence | other

# Optional fields
framework: null  # e.g., "shadcn/ui" for wireframe, "mermaid" for diagram
checklist:
  required: []  # List of check names that MUST pass
  banned: []    # List of check names that MUST NOT run
dependencies: []  # Other epics this depends on

# Metadata
owner: "agent-name"  # Which agent owns this epic
notes: "Template epic - replace all values when copying"
