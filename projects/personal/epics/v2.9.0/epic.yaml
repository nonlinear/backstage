notes: |
  ## Epic Refactor (2026-03-13)
  
  **Original plan:** Always-on-top desktop timer app (Electron/Tauri/Swift)
  **Problem:** Won't work on iPad (Nicholas's primary device during work)
  **New approach:** Device-native timer triggers (iOS Shortcuts, macOS built-in)
  
  ## Why Device-Based
  
  **iPad usage pattern:**
  - Primary device during Pomodoro sessions
  - Backstage UI open in browser
  - Desktop app won't run on iPadOS
  
  **iOS Shortcuts advantages:**
  - Native to device (already installed)
  - Siri integration ("Hey Siri, start Pomodoro")
  - Timer notifications work across devices
  - No custom app development needed
  
  ## Implementation Strategy
  
  **1. iOS Shortcuts (iPad/iPhone):**
  
  Create shortcut "Start Pomodoro":
  ```
  Input: Duration (25min, 45min, custom)
  Actions:
    - Start Timer (duration)
    - Show notification ("Pomodoro started - focus time!")
  ```
  
  **Trigger from pomo skill:**
  - Generate URL: `shortcuts://run-shortcut?name=Start%20Pomodoro&input=25`
  - User clicks link in Backstage UI → opens Shortcuts → starts timer
  - Fallback: Manual timer start if URL scheme fails
  
  **2. macOS (when on Mac):**
  - Use `caffeinate -u -t 1500` (keep Mac awake, 25min)
  - Terminal notification: `osascript -e 'display notification "Pomodoro complete!"'`
  - Or: macOS built-in Timer app
  
  **3. Google Calendar Integration (existing):**
  - Calendar event created (shows in iPad widget)
  - 5-min warning = Calendar reminder
  - Completion = Calendar alert
  - Reflection = update event notes field
  
  ## Removed Sections
  
  **Timer UI group:** Won't work on iPad, removed
  **Integration group (old):** Replaced with device-native trigger
  **Tech Stack group:** No custom app needed, removed
  
  ## Success Criteria
  
  - [ ] iOS Shortcut "Start Pomodoro" created
  - [ ] URL trigger works from Safari (iPad)
  - [ ] Timer starts on device (iPad/iPhone/Mac)
  - [ ] 5-min warning notification works
  - [ ] Completion notification works
  - [ ] Reflection prompt works (Telegram or Calendar)
  - [ ] Calendar event updated with reflection
  
  ## Future Enhancements
  
  - Siri integration ("Hey Siri, start Pomodoro")
  - Automatic device detection (skip manual trigger)
  - Stats tracking (Pomodoros completed via Calendar API)
  - Break timer ("Start 5-min break" shortcut)
