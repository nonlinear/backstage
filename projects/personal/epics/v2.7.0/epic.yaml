  ## Why Meshtastic
  
  **Resilience:** Off-grid communication when internet/cell fails
  **Community:** Mutual aid coordination (disasters, protests, power outages)
  **Autonomy:** Decentralized, encrypted, no corporate control
  
  ## Use Cases
  
  - Emergency alerts (neighborhood watch, medical, fire)
  - Mutual aid coordination (who needs what, who can help)
  - Community events (coordination without internet)
  - Protest safety (encrypted, off-grid comms)
  
  ## Hardware Options
  
  - **T-Beam:** GPS, LoRa, battery, solar-ready (~$50)
  - **Heltec V3:** Smaller, lighter, cheaper (~$30)
  - Both: ESP32, 915MHz LoRa, Meshtastic compatible
  
  ## Philosophy
  
  Infrastructure = mutual aid. Networks = community power.
