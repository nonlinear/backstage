notes: |
  ## Context
  
  **iPad:** iPad Mini (or other model)
  **Purpose:** Kids access to media library via Tailscale
  
  ## Tailscale URLs (when connected)
  
  - **Kavita:** https://media.adal-rigel.ts.net:5007
  - **Komga:** https://media.adal-rigel.ts.net:5009
  - **Jellyfin:** https://media.adal-rigel.ts.net:8096
  
  ## Kids Accounts
  
  **Create separate accounts for:**
  - Kid 1
  - Kid 2
  
  **Each account needs:**
  - Username/password
  - Access restrictions (age-appropriate content)
  - Reading progress tracking
  
  ## App Installation
  
  **iOS Apps:**
  - Kavita: Search App Store (or use web app)
  - Komga: Web app (no official iOS app)
  - Jellyfin: Search App Store
  
  ## Success Criteria
  
  - [ ] iPad connects to Tailscale automatically
  - [ ] Both kids can log into Kavita, Komga, Jellyfin
  - [ ] Reading progress syncs across devices
  - [ ] Parental controls configured (if needed)
