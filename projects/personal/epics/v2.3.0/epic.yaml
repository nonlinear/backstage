  ## Stack Stability Report (Reddit r/selfhosted)
  
  **User experience:** "Arr stack is incredibly stable lol."
  
  **Years of uptime:** Rock solid for many years with auto-updates enabled.
  
  **Rare issues:**
  - Jellyfin broke once after 1 update
  - Fileflows flow (internal script) broke once (unrelated to auto-updates)
  
  **Manual maintenance required:**
  - Weekly: Fix stale downloads
  - Weekly: Import failed-to-import movies/shows
  - User prefers manual weekly cleanup over adding more helper services
  
  **Philosophy:** "Easier to do this weekly than setting up yet another helper service to fix these for me. 😅"
  
  ## Stack Components
  
  **Core:**
  - Radarr (movies)
  - Sonarr (TV shows)
  - Prowlarr (indexer manager)
  - qBittorrent (torrent client)
  - Jellyfin/Emby (media server)
  
  **Helpers:**
  - Seerr (request management - replaces Jellyseerr/Ombi)
  - Fileflows (file processing automation)
  - Unpackerr (auto-extract compressed downloads)
  
  **Custom:**
  - "some of my own vibecoded garbage" (user's custom scripts)
  
  ## Success Criteria
  
  - [ ] All core apps installed + configured
  - [ ] Auto-download working (request → download → import → available in Jellyfin)
  - [ ] Weekly maintenance routine documented
  - [ ] Known issues documented (for troubleshooting)
  
