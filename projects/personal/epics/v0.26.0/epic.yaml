  ## Why This Matters
  
  **Scenario:** Nicholas traveling internationally (Brasil, outro país)
  - iPad/iPhone primary devices (MacBook at home)
  - Tailscale = lifeline to NAS services (Kavita, Home Assistant)
  - If service down mid-trip → férias arruinadas (can't fix remotely)
  
  **Solution:** Pre-travel health check (24h before departure)
  - Verifies all critical services accessible via Tailscale
  - Alerts if anything broken (time to fix BEFORE leaving)
  - Recovery docs (if stuck abroad, how to restart services)
  
  ## Critical Services
  
  **Must work remotely:**
  - Kavita (ebooks, comics - entertainment)
  - Home Assistant (voice control, automation)
  - Paperless (documents, receipts)
  
  **Nice to have:**
  - Komga (manga)
  - Jellyfin (videos)
