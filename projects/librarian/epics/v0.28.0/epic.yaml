research_questions:
  - "EPUB.js vs other libraries (Readium, Foliate)?"
  - "CFI (Canonical Fragment Identifier) = best way to save position?"
  - "localStorage vs IndexedDB for page memory?"
  - "Deep link precedence: Hash navigation vs reader state?"

risks:
  - "EPUB rendering in browser = complex (fonts, images, CSS)"
  - "CFI parsing may fail on malformed EPUBs"
  - "localStorage size limits (5-10MB) may be issue for many books"

dependencies:
  - epic/v0.27.0 (GUI Index Browser) must be stable first

notes: |
  **Context:**
  - Nicholas wants to replace Kavita (Docker container, separate app)
  - Librarian GUI = index browser + reader in one
  - Pinned books = frequently read (save position, warn on deeplink)
  
  **User flow:**
  1. Browse library → Click book card → Opens reader
  2. Read book → Position auto-saved (if pinned)
  3. Close reader → Returns to topic view
  4. Navigate away → Deeplink with hash
  5. Return to site → "Return to reading X?" (if pinned + hash matches)
  
  **Technical:**
  - EPUB.js = MIT license, actively maintained
  - CFI = standard for EPUB position (like page number)
  - localStorage = simple, 5MB limit (good enough for metadata)
  - Portrait/landscape = CSS media queries (no JS needed)
  
  **Design inspiration:**
  - Apple Books (iOS) - pin/unpin UX
  - Calibre Web - EPUB.js integration
  - Kavita - return to reading banner
