goal: |
  Turn Librarian GUI into full EPUB reader with page memory, deep linking, 
  and portrait/landscape layouts. Replace Kavita for reading + research workflow.

success_criteria:
  - EPUB files render correctly in browser
  - Page position persisted (pinned books)
  - Deep links work: /AI/policy#book.epub → Opens reader at last page
  - Portrait/landscape CSS adapts to screen orientation
  - Warning banner: "Return to reading?" if pinned book + deeplink exists

