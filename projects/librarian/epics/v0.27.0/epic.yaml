notes: |
  ## Critical Requirements (2026-03-10 22:16)
  
  **Title:** "Librarian" (NOT "Index Browser")
  - App title, browser tab, metadata
  
  **Icon:**
  - Background watermark (header-with-icon CSS)
  - Favicon (browser tab)
  - PWA app icon (installable web app)
  
  **Tailscale:**
  - Accessible remotely via https://librarian.adal-rigel.ts.net
  - Must survive reboot
  - Must survive Mac sleep/wake
  
  **Always-on:**
  - LaunchAgent (auto-start on boot)
  - Health check (restart if crashed)
  - Uptime Kuma monitoring (Telegram alerts)
  
  **Web App:**
  - PWA manifest (installable on iPad)
  - Offline-capable (future)
  - Fast load times
  
  ## Design Decisions
  
  **Single process architecture:**
  - Next.js app (port 8766)
  - Watchdog observer (background thread)
  - MCP server stays separate (different lifecycle)
  
  **Watcher triggers:**
  - File added → reindex topic → reload GUI
  - File removed → reindex topic → reload GUI
  - File modified → reindex topic → reload GUI
  
  **GUI features (current):**
  - ✅ List all 73 topics (grouped by root folder)
  - ✅ Show books per topic (horizontal scroll)
  - ✅ Cover images (171 extracted)
  - ✅ URL routing (/AI/policy)
  - ✅ Hash scroll (#book.epub)
  - ⏸️ Search/filter (future)
  - ⏸️ EPUB reader (epic v0.28.0)
  
  **Port:** 8766 (fixed, never change)
  
  ## Tech Stack
  
  - Next.js 16.1.6 (Turbopack)
  - React 19.2.3
  - Shadcn UI (copied from Backstage)
  - Tailwind CSS
  - TypeScript
  - 711 packages installed
  
