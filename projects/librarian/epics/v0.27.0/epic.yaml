notes: |
  ## Design Decisions
  
  **Single process architecture:**
  - Flask GUI (port 8766)
  - Watchdog observer (background thread)
  - MCP server stays separate (different lifecycle)
  
  **Watcher triggers:**
  - File added → reindex topic → reload GUI
  - File removed → reindex topic → reload GUI
  - File modified → reindex topic → reload GUI
  
  **GUI features:**
  - List all 73 topics
  - Show books per topic
  - Search/filter topics
  - Click topic → expand books
  - Minimal UI (no heavy JS framework)
  
  **Port:** 8766 (already configured in localhost-manager.sh)
  
  ## Tech Stack
  
  - Flask (web framework)
  - watchdog (file watching)
  - Jinja2 (templating)
  - JSON (data source: .library-index.json)
  
  ## Success Criteria
  
  - GUI shows all topics + books
  - Search filters topics instantly
  - Add book → <10s auto-reindex → GUI updates
  - Single command to start everything
  - Works on localhost:8766
