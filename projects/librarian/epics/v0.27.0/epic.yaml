  **Phase 1 (DONE):**
  - ✅ GUI shows all topics + books
  - ✅ Horizontal scroll layout (Backstage pattern)
  - ✅ Cover images displayed
  - ✅ URL routing + hash scroll
  
  **Phase 2 (IN PROGRESS):**
