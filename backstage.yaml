---
# Backstage Configuration
# Single source of truth for tiers, checks, epics, glossary
# DRY: All components reference this file

# ============================================================================
# TIERS - Project priority/maturity levels
# ============================================================================
tiers:
  - name: flagship
    label: Flagship
    description: Production-ready, actively maintained, core projects
    order: 1

  - name: experimental
    label: Experimental
    description: Exploration, prototypes, early-stage development
    order: 2

  - name: backlog
    label: Backlog
    description: Ideas, future projects, on hold
    order: 3

  - name: template
    label: Template
    description: Scaffolding, boilerplate, reference implementations
    order: 4

# ============================================================================
# CHECKS - Global validation scripts (apply to all projects)
# ============================================================================
checks:
  - README.md
  - branch-workflow.md
  - changelog.sh
  - commit-style.md
  - context-snapshot.md
  - contract-diagram-discipline.md
  - detect-obsolete-references.sh
  - doc-parity.md
  - dual-track.md
  - edit-confirmation.md
  - epic-branch.sh
  - epic-format.md
  - epic-notes-link.sh
  - epic-notes.md
  - epic-syntax.sh
  - formatting.md
  - gaps-list.sh
  - git.sh
  - install-update.md
  - links-syntax.sh
  - merge-to-main.md
  - navigation-syntax.sh
  - pre-commit.md
  - published-skill-minimalism.md
  - readme-reality.sh
  - rebase-cadence.md
  - rebase-divergence.sh
  - rebase-merge.md
  - required-syntax.sh
  - roadmap-tasks.md
  - roadmap-tasks.sh
  - semver-syntax.sh
  - semver.md
  - skill-publish-warning.sh
  - skills-republish.md

# ============================================================================
# EPICS - Status lifecycle and transitions
# ============================================================================
epics:
  # Canonical order: active → backlog → published
  statuses:
    active:
      order: 1
      description: "Has unfinished tasks, has branch. Work in progress."
      conditions:
        - "Has tasks (beyond default template)"
        - "Has git branch (not on main)"
        - "Not all tasks checked"
      can_transition_to:
        - published
        - backlog
    
    backlog:
      order: 2
      description: "Only default tasks, unchecked. Not started yet. No branch."
      conditions:
        - "Only has default unchecked tasks"
        - "No custom tasks added"
        - "On main branch (no epic branch)"
      can_transition_to:
        - active
    
    published:
      order: 3
      description: "All tasks checked. Terminal state."
      conditions:
        - "All tasks checked (100% complete)"
        - "Epic is done"
      can_transition_to: []

  # Transition rules
  transitions:
    backlog_to_active:
      trigger: "Add tasks or create branch"
    
    active_to_published:
      trigger: "Check all tasks"
      
    active_to_backlog:
      trigger: "Remove all custom tasks and return to main"
      note: "Regression, avoid if possible"

  # Display order (everywhere)
  display_order:
    - active
    - backlog
    - published

# ============================================================================
# GLOSSARY - Terminology and structure definitions
# ============================================================================
glossary:
  # SOURCE OF TRUTH for terminology and structure
  # When we say "Project", we mean THIS definition.
  # ROOT = ~/Documents/backstage

  structure:
    project:
      description: "Top-level organization unit"
      location: "ROOT/projects/*"
      examples: ["backstage", "personal", "librarian"]
      metadata: "index.yml (includes tier)"
      
    epic:
      description: "Version-scoped work unit within a project"
      location: "ROOT/projects/*/vN.N.N"
      naming: "vN.N.N (semantic versioning)"
      required_files:
        - "index.md (THE CONTRACT - always present)"
        - "index.yml (metadata - tier, type, etc.)"
      template: "Will be created in v2.2.0-object-templates epic"
      
    epic_note:
      description: "Any .md file inside epic folder (NOT the contract)"
      location: "ROOT/projects/*/vN.N.N/*.md"
      examples: ["research.md", "notes.md", "decisions.md"]
      note: "index.md is special (it's the contract, not a note)"
      
    tier:
      description: "Project classification/type"
      location: "Defined in epic's index.yml"
      examples: ["infrastructure", "product", "research"]
      purpose: "Affects which checklists apply to project"
      
    agent:
      description: "AI agent definition/config"
      location: "ROOT/agents/*"
      metadata: "index.yml (includes squad)"
      examples: ["secretaria", "defense", "uxr", "legal"]
      
    squad:
      description: "Agent classification/type"
      location: "Defined in agent's index.yml"
      examples: ["assisted", "unassisted", "strategic"]
      purpose: "Affects model selection, reasoning level, supervision"
      
    check:
      description: "Executable validation script"
      location: "ROOT/checks/*"
      types: ["bash", "python", "node"]
      examples: ["git-clean.sh", "test-coverage.py", "lint.js"]
      
    checklist:
      description: "Required and banned checks for an object"
      applies_to: ["agent", "project", "epic", "global"]
      structure:
        required: ["list of check names that MUST pass"]
        banned: ["list of check names that MUST NOT run"]
      location: "Defined in object's index.yml or global config"
      
    checkpoint:
      description: "Triggered validation event that composites checklists"
      trigger: "Event (e.g., epic status change, git push, deploy)"
      process:
        - "Collect all applicable checklists (global + project + epic + agent)"
        - "Resolve conflicts (banned overrides required at lower scope)"
        - "Execute composite check list"
        - "Generate pass/fail report"
      blocks: "Epic progression until all checks pass"
      audit: "Logs execution (versioned, reproducible)"

  contracts:
    types:
      diagram:
        description: "Flowchart/workflow visualization"
        format: "mermaid"
        use_case: "Process flows, state machines"
        
      wireframe:
        description: "UI mockup/design"
        format: "excalidraw or figma link"
        use_case: "Interface layouts, user flows"
        
      schema:
        description: "Data structure definition"
        format: "json-schema or typescript interface"
        use_case: "API contracts, database schemas"
        
      spec:
        description: "Detailed requirements doc"
        format: "markdown with yaml frontmatter"
        use_case: "Feature specs, API docs"

  naming:
    projects:
      rules:
        - "lowercase"
        - "kebab-case for multi-word"
        - "descriptive, not cryptic"
      examples:
        good: ["backstage", "librarian", "billable-hours"]
        bad: ["BS", "lib", "bh"]
        
    epics:
      format: "vMAJOR.MINOR.PATCH"
      rules:
        - "Semantic versioning"
        - "Always prefixed with 'v'"
        - "MAJOR.0.0 = breaking change"
        - "0.MINOR.0 = new feature"
        - "0.0.PATCH = bug fix"
      examples: ["v0.1.0", "v1.2.3", "v2.0.0"]
      
    agents:
      rules:
        - "lowercase"
        - "kebab-case for multi-word"
        - "role-based (what they do)"
      examples:
        good: ["secretaria", "defense", "uxr", "legal"]
        bad: ["agent1", "helper", "bot"]
        
    checks:
      format: "kebab-case.{sh|py|js}"
      rules:
        - "Verb-noun pattern preferred"
        - "Extension indicates language"
        - "Descriptive, action-oriented"
      examples:
        good: ["git-clean.sh", "test-coverage.py", "lint.js"]
        bad: ["check1.sh", "validate.py", "run.js"]

  workflows:
    epic_lifecycle:
      - status: backlog
        description: "Epic created, no work started"
        next: "Add tasks → active"
        
      - status: active
        description: "Epic has branch, work in progress"
        next: "Complete all tasks → published"
        
      - status: published
        description: "Epic done, tasks checked, merged to main"
        next: "Terminal state"
        
    checkpoint_execution:
      - step: "Event trigger (e.g., epic → active)"
      - step: "Collect checklists (global, project, epic, agent)"
      - step: "Resolve conflicts (banned > required at lower scope)"
      - step: "Execute composite checklist"
      - step: "Generate report (pass/fail per check)"
      - step: "Block or allow transition based on results"
      - step: "Log audit trail (versioned, reproducible)"

  philosophy:
    dry:
      principle: "Don't Repeat Yourself"
      application: "Single source of truth for each concept"
      examples:
        - "Tier definitions → backstage.yaml (this file)"
        - "Epic statuses → backstage.yaml (this file)"
        - "Check inventory → backstage.yaml (this file)"
      
    contracts:
      principle: "Diagram as contract for agreed-upon AI development"
      application: "Contract-first workflow, implementation follows diagram"
      benefits:
        - "Clear expectations before coding"
        - "AI can validate against contract"
        - "Human approves diagram, AI implements"
        
    cybernetic_steering:
      principle: "Self-correcting systems via feedback loops"
      application: "Checkpoints detect drift, auto-correct to contract"
      mechanism:
        - "Contract defines desired state"
        - "Checks measure current state"
        - "System converges to contract"

---
